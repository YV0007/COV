[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cov"
version = "0.1.0"
description = "Portfolio Correlation & Exposure Model — a measurement and transparency instrument"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Yehor Vasylchenko" }]

# Runtime deps are pinned in requirements.txt for reproducible local installs.
# This list mirrors the essentials so `pip install -e .` also works.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "yfinance>=0.2.40",
    "pandas-datareader>=0.10",
    "requests>=2.31",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
    "plotly>=5.20",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
cov-pipeline = "cov.pipeline:main"

[tool.setuptools]
# Explicit package list — the phase folders are packages too.
packages = ["cov", "config", "resolution", "engine", "analytics", "reports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
