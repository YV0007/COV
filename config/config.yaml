# COV — central configuration

base_currency: USD

ingestion:
  input_file: examples/portfolio_example.csv
  overrides_file: config/entity_overrides.example.yaml
  canonical_id_style: ticker_slug
  exchange_prefixes: [ETR, ASX, HKG, EPA, CVE, LON, BIT, TSE, CNSX, FRA, SWX]
  fund_name_patterns: [ETF, Trust, Fund, ETC]
  reconciliation:
    parsed_total_market_value_usd: null
    parsed_total_cost_basis_usd: null
    statement_total_market_value_usd: null
    tolerance_usd: 0.01

paths:
  data_dir: data

  raw_dir: data/raw
  raw_custodian: data/raw/custodian
  raw_holdings: data/raw/holdings
  raw_prices: data/raw/prices

  parquet_dir: data/parquet
  parquet_prices: data/parquet/prices
  parquet_holdings: data/parquet/holdings
  parquet_factors: data/parquet/factors

  snapshots_dir: data/snapshots
  snapshots_book: data/snapshots/book
  snapshots_covariance: data/snapshots/covariance
  snapshots_exposure: data/snapshots/exposure

  warehouse_duckdb: data/warehouse.duckdb

  logs_dir: logs
  reports_out: reports/output

storage:
  engine: duckdb
  prices_partition: year
  holdings_partition: asof_month
  snapshot_partition: run_date
  reference_tables:
    - entity_map
    - instrument_metadata
    - run_metadata
    - data_quality_flags

prices:
  source: yfinance
  return_type: log
  start_date: 2016-01-01
  min_history_days: 750
  symbol_overrides_file: config/symbol_overrides.example.yaml
  max_workers: 6
  quality_gates:
    max_missing_pct: 5.0
    stale_price_days: 5
    outlier_sigma: 4.0
    outlier_rolling_window: 21
  fx:
    convert_to_base: true
    source: yfinance
  crypto_spot:
    BTC: BTC-USD
    ETHA: ETH-USD
    BSOL: SOL-USD

lookthrough:
  refresh: monthly
  issuers: [iShares, Vanguard, SSGA, Invesco, VanEck, GlobalX, Amundi, FirstTrust]
  classification_file: config/etf_classification.example.yaml
  sources_file: config/etf_holdings_sources.example.yaml
  overrides_file: config/constituent_overrides.example.yaml
  reconciliation:
    weight_sum_tolerance: 0.02
    total_tolerance: 0.000001
  report_top_n: 15

covariance:
  estimator: ledoit_wolf
  clean: rie
  detone: true
  windows:
    rolling_days: 90
    ewma_lambda: 0.94
  robustness:
    spearman: true

structure:
  correlation_distance: sqrt_2_1_minus_rho
  clustering_linkage: ward
  declared_sector_count: 20
  absorption_ratio_top_n: 5

factors:
  market_proxy: ACWI
  fama_french: true
  macro:
    rates_10y: DGS10
    credit_hy_oas: BAMLH0A0HYM2
    usd_index: DTWEXBGS
    oil: WTI
    crypto_beta: BTC-USD
  style_proxies:
    growth: VONG
    dividend_value: QDIV

stress:
  episodes:
    covid_2020: { start: 2020-02-19, end: 2020-03-23 }
    rate_shock_2022: { start: 2022-01-03, end: 2022-10-14 }
  scenarios:
    all_correlations_to: 0.9

reporting:
  format: html
  schedule: monthly

logging:
  level: INFO
  to_file: true
  to_console: true
