# =============================================================================
# COV — central configuration
# Single place for paths and parameters. Code reads this via config/loader.py.
# Paths are resolved relative to the project root unless absolute.
# =============================================================================

# --- Base currency (Phase 1 decision) -----------------------------------------
# Everything is converted to this before any correlation math.
# Defaulting to USD: most holdings, ETFs, crypto and FRED factor data are USD-native,
# which minimises conversion noise. Switch to EUR here if the client reports in EUR.
base_currency: USD

# --- Phase 1: ingestion & instrument resolution -------------------------------
# Reads the raw custodian sheet, normalizes tickers, resolves each row to a
# canonical instrument (default = group by ISIN, else by ticker; overrides in
# entity_overrides.yaml), nets across custodians, and writes one clean netted
# book. FX is a no-op here (money columns are already USD) — see resolution/.
ingestion:
  # Ships pointing at the example portfolio so `python -m cov.pipeline` runs out of the
  # box. For your own book: drop your sheet at data/raw/custodian/positions_raw.csv and
  # copy config/*.example.yaml -> config/*.yaml (both are gitignored), then repoint here.
  input_file: examples/portfolio_example.csv         # fictional example book (250 assets)
  overrides_file: config/entity_overrides.example.yaml
  canonical_id_style: ticker_slug                    # readable ids (ASML, BTC, GOOGL)
  # Exchange prefixes to strip off the ticker into a separate `exchange` field.
  exchange_prefixes: [ETR, ASX, HKG, EPA, CVE, LON, BIT, TSE, CNSX, FRA, SWX]
  # Name substrings that flag a row as a fund (look-through candidate in Phase 3).
  fund_name_patterns: [ETF, Trust, Fund, ETC]
  reconciliation:
    # The Phase 1 sign-off test. The netted total must match the custodian
    # statement to the cent. No statement figure supplied yet, so we assert the
    # parsed-total INVARIANT (netting only sums rows -> total must be unchanged).
    # When you get the real UBS/LLB/IB statement totals, set them below and the
    # test switches to reconciling against them (any delta explained by raw_id).
    parsed_total_market_value_usd: null              # set locally to your book's total
    parsed_total_cost_basis_usd: null                # (kept out of the public repo)
    statement_total_market_value_usd: null           # <- plug in when supplied
    tolerance_usd: 0.01                               # "to the cent"

# --- Paths --------------------------------------------------------------------
# Storage design (see README §Storage): Parquet files are the append-only system of
# record; a single DuckDB file is the SQL query layer over them + home for small
# hand-edited reference tables. ALL disk access goes through cov/storage.py.
# Contents are git-ignored; the folder skeleton is tracked via .gitkeep.
paths:
  data_dir: data

  # raw/ — untouched downloads, the audit trail, never edited (dated files)
  raw_dir: data/raw
  raw_custodian: data/raw/custodian     # position statements as received
  raw_holdings: data/raw/holdings       # issuer ETF holdings CSVs
  raw_prices: data/raw/prices           # raw price pulls, if kept

  # parquet/ — cleaned, typed, columnar: the system of record
  parquet_dir: data/parquet
  parquet_prices: data/parquet/prices       # daily prices/returns, partitioned year=YYYY
  parquet_holdings: data/parquet/holdings   # ETF constituents, one dir per asof=YYYY-MM
  parquet_factors: data/parquet/factors     # FF factors, FRED series, FX

  # snapshots/ — per-run analytical outputs, immutable, one dir per run=YYYY-MM-DD
  snapshots_dir: data/snapshots
  snapshots_book: data/snapshots/book             # resolved netted book per run
  snapshots_covariance: data/snapshots/covariance # cleaned matrices + metadata
  snapshots_exposure: data/snapshots/exposure     # Phase 3 effective-exposure tables

  # warehouse — DuckDB query engine + small relational reference tables
  warehouse_duckdb: data/warehouse.duckdb

  logs_dir: logs
  reports_out: reports/output

# --- Storage engine -----------------------------------------------------------
# Parquet = system of record (durable, portable, auditable). DuckDB = the lens.
# Rule of thumb: bulk numeric time-series -> Parquet; small hand-edited/joined
# tables -> DuckDB. Writes are append-only; reference-table edits happen in DuckDB.
storage:
  engine: duckdb
  prices_partition: year          # parquet/prices/year=YYYY/*.parquet
  holdings_partition: asof_month  # parquet/holdings/asof=YYYY-MM/*.parquet
  snapshot_partition: run_date    # snapshots/<kind>/run=YYYY-MM-DD/*.parquet
  # Small relational tables that live inside DuckDB (never only-in-db data):
  reference_tables:
    - entity_map              # ISIN/ticker <-> canonical instrument (hand-edited)
    - instrument_metadata     # sector labels, type flag, GICS-like sector
    - run_metadata            # per-run: window, estimator, condition #, eff. rank, coverage
    - data_quality_flags      # per-run per-instrument QC flags

# --- Phase 2: price history & data-quality gates ------------------------------
prices:
  source: yfinance                # abstracted behind a fetcher interface
  return_type: log                # log returns (additive over time)
  start_date: 2016-01-01          # ~10y window; widen later. Short names are flagged.
  min_history_days: 750           # target; shorter names are flagged, not dropped
  symbol_overrides_file: config/symbol_overrides.example.yaml  # canonical_id -> Yahoo symbol fixes
  max_workers: 6                  # parallel yfinance fetches (polite; avoids throttling)
  quality_gates:
    max_missing_pct: 5.0          # flag instruments with >5% missing trading days
    stale_price_days: 5           # flag runs of N identical consecutive closes
    outlier_sigma: 4.0            # flag returns beyond Nσ of rolling 21-day mean
    outlier_rolling_window: 21
  # FX: convert every price series to base_currency (USD) before computing returns,
  # so FX co-movement is captured as the shared factor a USD investor actually bears.
  fx:
    convert_to_base: true
    source: yfinance              # spot FX via '<CCY>USD=X' (inverse of 'USD<CCY>=X')
  # Crypto: for coin exposures use the UNDERLYING SPOT (long, clean), not the ETF.
  # Keyed by canonical_id. COIN (Coinbase) is an equity and stays off this list.
  crypto_spot:
    BTC: BTC-USD                  # merged IBIT + CBTC
    ETHA: ETH-USD                 # iShares Ethereum Trust -> Ether spot
    BSOL: SOL-USD                 # Bitwise Solana -> Solana spot

# --- Phase 3: ETF look-through ------------------------------------------------
lookthrough:
  refresh: monthly                # snapshot cadence; store every snapshot
  # Issuer holdings are fetched per-ETF; issuer scrapers live in resolution/.
  issuers: [iShares, Vanguard, SSGA, Invesco, VanEck, GlobalX, Amundi, FirstTrust]
  # Hand-maintained judgement layer over the broad Phase 1 is_fund flag: what to DO
  # with each fund (equity=decompose / commodity / crypto / not_a_fund). Derived
  # from the netted book; any flagged fund missing from it is surfaced, not guessed.
  classification_file: config/etf_classification.example.yaml
  # fund_id -> {issuer, url, format} registry for the per-fund holdings CSVs.
  sources_file: config/etf_holdings_sources.example.yaml
  # Manual constituent->canonical fixes (identifier -> canonical_id) for the
  # look-through resolver, on top of ISIN/ticker/name matching.
  overrides_file: config/constituent_overrides.example.yaml
  reconciliation:
    # A constituent CSV should sum to ~100%. Flag (don't drop) funds whose parsed
    # weights fall outside this band — likely an incomplete or stale download.
    weight_sum_tolerance: 0.02
    # Global invariant: decomposed exposures must re-sum to the book's total weight.
    total_tolerance: 0.000001
  report_top_n: 15                # rows in the declared-vs-true concentration tables

# --- Phase 4: covariance / correlation engine ---------------------------------
covariance:
  estimator: ledoit_wolf          # sample -> Ledoit-Wolf shrinkage
  clean: rie                      # rie | clip | none  (RIE preferred over naive clip)
  detone: true                    # remove market eigenvector after cleaning
  windows:
    rolling_days: 90
    ewma_lambda: 0.94             # RiskMetrics
  robustness:
    spearman: true                # rank-correlation cross-check
  # Every produced matrix must carry: window, method, condition number,
  # effective rank, coverage %. Enforced in engine/, not here.

# --- Phase 5: structure detection ---------------------------------------------
structure:
  correlation_distance: sqrt_2_1_minus_rho   # d = sqrt(2(1-rho))
  clustering_linkage: ward
  declared_sector_count: 20                  # the client's self-declared taxonomy
  absorption_ratio_top_n: 5                  # eigenvectors counted as "systemic"

# --- Phase 6: factor overlay (economic naming) --------------------------------
factors:
  market_proxy: ACWI
  fama_french: true               # Ken French daily library (Mkt-RF, SMB, HML, RMW, CMA, Mom)
  macro:
    rates_10y: DGS10              # FRED
    credit_hy_oas: BAMLH0A0HYM2   # FRED
    usd_index: DTWEXBGS           # FRED trade-weighted; DXY via yfinance alt
    oil: WTI                      # FRED/yfinance
    crypto_beta: BTC-USD          # from price layer
  style_proxies:                  # optional own-ETF sleeve proxies
    growth: VONG
    dividend_value: QDIV

# --- Phase 7: risk attribution & stress ---------------------------------------
stress:
  # Historical episode windows (you define these; used for regime-correlation replay).
  episodes:
    covid_2020: { start: 2020-02-19, end: 2020-03-23 }
    rate_shock_2022: { start: 2022-01-03, end: 2022-10-14 }
  scenarios:
    all_correlations_to: 0.9      # stress: force off-diagonal correlations up

# --- Phase 8: reporting -------------------------------------------------------
reporting:
  format: html                    # html (weasyprint -> pdf optional later)
  schedule: monthly               # batch, not real-time

# --- Logging ------------------------------------------------------------------
logging:
  level: INFO                     # DEBUG | INFO | WARNING | ERROR
  to_file: true
  to_console: true
