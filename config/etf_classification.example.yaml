# =============================================================================
# EXAMPLE fund-treatment classification (Phase 3) — for the example portfolio.
# Copy to config/etf_classification.yaml (gitignored) for your own book.
#   equity      -> decompose into single-name equity constituents
#   commodity   -> physically-backed single commodity (no equity basket)
#   crypto      -> coin exposure (already spot in Phase 2); excluded from equity agg
#   not_a_fund  -> is_fund false positive; treat as a direct single name
# =============================================================================

equity:
  # broad / core
  - SPY      # SPDR S&P 500
  - VOO      # Vanguard S&P 500
  - IVV      # iShares Core S&P 500
  - VTI      # Vanguard Total US Market
  - QQQ      # Invesco QQQ (NASDAQ-100)  [source gated -> stays ballast]
  - IWM      # iShares Russell 2000
  - DIA      # SPDR Dow Jones
  - EFA      # iShares MSCI EAFE
  - EEM      # iShares MSCI Emerging Markets
  # growth / tech / semis
  - VGT      # Vanguard Information Technology
  - VUG      # Vanguard Growth
  - IWF      # iShares Russell 1000 Growth
  - IYW      # iShares US Technology
  - XLK      # Technology Select SPDR
  - SMH      # VanEck Semiconductor
  - SOXX     # iShares Semiconductor
  # sector SPDRs
  - XLF      # Financials
  - XLE      # Energy
  - XLV      # Health Care
  - XLI      # Industrials
  - XLY      # Consumer Discretionary
  - XLP      # Consumer Staples
  - XLU      # Utilities
  - XLC      # Communication Services
  - XLRE     # Real Estate
  - XBI      # SPDR S&P Biotech

crypto:
  - IBIT     # iShares Bitcoin Trust -> BTC spot

commodity: []
not_a_fund: []
