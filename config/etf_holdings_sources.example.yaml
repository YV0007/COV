# =============================================================================
# EXAMPLE ETF holdings-source registry (Phase 3) — for the example portfolio.
# Copy to config/etf_holdings_sources.yaml (gitignored) for your own book.
#   url       : direct download ({date}=YYYYMMDD walked back from the run date)
#   path      : local file to read instead of a url (for gated funds)
#   filetype  : csv | xlsx | xls | json   (header row auto-detected)
# A fund with no usable entry is reported "no source" and left as ballast.
# =============================================================================
sources:
  # Real, public issuer files (live-verified) so look-through actually demonstrates.
  # State Street / SPDR — XLSX:
  SPY: { issuer: SSGA, filetype: xlsx, url: "https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/holdings-daily-us-en-spy.xlsx" }
  XLF: { issuer: SSGA, filetype: xlsx, url: "https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/holdings-daily-us-en-xlf.xlsx" }
  XLE: { issuer: SSGA, filetype: xlsx, url: "https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/holdings-daily-us-en-xle.xlsx" }
  XLK: { issuer: SSGA, filetype: xlsx, url: "https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/holdings-daily-us-en-xlk.xlsx" }
  XBI: { issuer: SSGA, filetype: xlsx, url: "https://www.ssga.com/us/en/intermediary/library-content/products/fund-data/etfs/us/holdings-daily-us-en-xbi.xlsx" }
  # iShares — CSV (/latest-holdings.csv; only the product id matters):
  IWM: { issuer: iShares, filetype: csv, url: "https://www.ishares.com/us/products/239710/ishares-russell-2000-etf/latest-holdings.csv" }
  EFA: { issuer: iShares, filetype: csv, url: "https://www.ishares.com/us/products/239623/ishares-msci-eafe-etf/latest-holdings.csv" }
  EEM: { issuer: iShares, filetype: csv, url: "https://www.ishares.com/us/products/239637/ishares-msci-emerging-markets-etf/latest-holdings.csv" }

  # Left un-wired (honest ballast until a source is added):
  # QQQ: { issuer: Invesco, filetype: csv, path: "data/raw/holdings/manual/QQQ.csv" }  # bot-gated -> manual drop
  # VGK / VNQ (Vanguard) -> JSON API; add like the Vanguard example in the docs.
