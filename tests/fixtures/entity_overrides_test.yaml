# Deterministic entity-resolution overrides for the Phase-1 test fixture
# (tests/fixtures/positions_test.csv). Fake data — exercises every netting case.
merges:
  ASML:
    canonical_id: ASML
    canonical_name: ASML Holding NV
    instrument_type: equity
    match_isin: [NL0010273215, USN070592100]     # Amsterdam ord + US ADR (1:1)
    shares_additive: true
  BTC:
    canonical_id: BTC
    canonical_name: Bitcoin (spot, via ETP wrappers)
    instrument_type: etp
    match_isin: [US46438F1012, CH1216478797]      # IBIT + 21Shares Bitcoin Core
    shares_additive: false                          # wrappers -> shares not additive

renames: []

keep_separate:
  - isins: [US02079K3059, US02079K1079]            # Alphabet A vs C
    reason: "Different share classes (GOOGL vs GOOG)"
  - isins: [DE0005190003, DE0005190037]            # BMW ordinary vs preferred
    reason: "Different share classes (BMW vs BMW3)"
  - isins: [US0970231058, GB0002634946]            # Boeing vs BAE Systems
    reason: "Ticker 'BA' can collide — resolve by ISIN"

data_quality_notes:
  12: "INDA MV looks like a price/transcription error, verify"
